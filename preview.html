.scr.pgf{animation:pgf .55s var(--e)}.scr.pgb{animation:pgb .55s var(--e)}
/* nav bawah: pil aktif meluncur */
.nav button{position:relative;z-index:1}
.nav.fx button.a{background:none;color:var(--nat)}
.nvi{position:absolute;left:0;top:6px;bottom:6px;border-radius:99px;background:var(--na);z-index:0;pointer-events:none;transition:transform .55s var(--e),width .55s var(--e)}
/* segmented control: thumb meluncur */
.seg{position:relative}.seg button{position:relative;z-index:1}
.seg.fx .a{background:none;color:var(--onx)}
.sgi{position:absolute;left:0;top:3px;bottom:3px;border-radius:99px;background:var(--on);z-index:0;pointer-events:none;transition:transform .5s var(--e),width .5s var(--e)}
/* bilah penyimpanan terisi dari 0 */
@keyframes grow{from{width:0}}.bar2 i{animation:grow 1.1s var(--e) .15s both}
/* umpan balik sentuh pada kartu & baris */
.card:active,.hc:active,.rc:active{transform:scale(.97)}.ar:active{transform:scale(.985)}.dy.has:active{transform:scale(.92)}
.mi:active img,.mi:active video{transform:scale(.97)}
@media(hover:hover){.card:hover,.hc:hover,.rc:hover{transform:translateY(-3px)}.card:active,.hc:active,.rc:active{transform:scale(.97)}}
/* baris daftar muncul berurutan */
.gp>.ar:nth-child(2){animation-delay:.05s}.gp>.ar:nth-child(3){animation-delay:.1s}.gp>.ar:nth-child(4){animation-delay:.15s}.gp>.ar:nth-child(5){animation-delay:.2s}.gp>.ar:nth-child(n+6){animation-delay:.25s}
/* gulir horizontal (kartu, pil kategori) halus */
.hs,.pills{scroll-behavior:smooth}

/* beberapa akun Google Drive */
.dv2{border-top:1px solid var(--sh);margin-top:8px;padding-top:8px}
.dv .row>span:first-child{display:flex;align-items:center;min-width:0}

/* Halaman login MIKA (mobile-first). Selalu memakai tema MIKA: hitam #0C0A0B + merah #CD0921 (warna logo).
   Image hero (assets/login-hero.png) memakai latar yang sama dengan halaman, jadi menyatu tanpa tepi. */
.ll{--k:#0C0A0B;--k2:#161113;--k3:#2B2326;--r:#CD0921;--r2:#FF4B5C;--t:#F5F1F2;--m:#9A8F93;
 position:fixed;inset:0;z-index:200;overflow-y:auto;overflow-x:hidden;background:var(--k);color:var(--t);font-family:var(--font,-apple-system,"SF Pro Text","Inter",system-ui,sans-serif);-webkit-font-smoothing:antialiased;color-scheme:dark;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.ll *{box-sizing:border-box;margin:0}
.ll-win{position:relative;display:flex;flex-direction:column;min-height:100%;width:100%;background:var(--k)}

/* ---- hero: image MIKA (di atas pada mobile) ---- */
.ll-hero{position:relative;order:1;margin:10px 14px 0;height:clamp(230px,38svh,380px);flex:none}
.ll-ph{position:absolute;inset:0;overflow:hidden;background:var(--k);border-radius:24px}
.ll-ph>img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.ll-ph:not(.has-photo){display:grid;place-items:center}
.ll-ph:not(.has-photo)::after{content:"MIKA";font-weight:800;font-size:clamp(56px,18vw,120px);letter-spacing:-.04em;color:var(--r)}

/* ---- form ---- */
.ll-main{order:2;flex:1;display:flex;flex-direction:column;align-items:center;padding:22px 32px calc(28px + env(safe-area-inset-bottom))}
.ll-form{container-type:inline-size;width:min(100%,376px)}
.ll-logo{display:grid;place-items:center;margin:0 auto;width:11.7cqw;height:11.7cqw;border-radius:3.4cqw;background:var(--r);color:#fff;font-weight:700;font-size:6.4cqw;line-height:1;box-shadow:0 10px 24px -10px rgba(205,9,33,.75)}
.ll-logo.img{background:none;box-shadow:none}
.ll-logo img{width:100%;height:100%;object-fit:cover;border-radius:3.4cqw;display:block;box-shadow:0 0 0 1px rgba(205,9,33,.5),0 10px 26px -10px rgba(205,9,33,.65)}
.ll-h{text-align:center;font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--t);margin-top:6.4cqw}
.ll-sub{text-align:center;font-size:15px;color:var(--m);margin-top:2cqw;line-height:1.3}
form.ll-f{margin-top:9cqw}
.ll-f label{display:block;font-size:14px;font-weight:600;color:var(--t);margin-bottom:3cqw}
.ll-f label+input+label,.ll-f .ll-gap{margin-top:6cqw}
.ll-f input{display:block;width:100%;height:max(48px,13.3cqw);padding:0 4.2cqw;border:1px solid var(--k3);border-radius:3.2cqw;background:var(--k2);color:var(--t);font-family:inherit;font-weight:400;font-size:16px;line-height:1;outline:0;-webkit-appearance:none;appearance:none;transition:border-color .2s,box-shadow .2s}
.ll-f input::placeholder{color:#7d7276;opacity:1}
.ll-f input:focus{border-color:var(--r);box-shadow:0 0 0 3px rgba(205,9,33,.28)}
.ll-f input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px var(--k2) inset;-webkit-text-fill-color:var(--t);caret-color:var(--t)}
.ll-forgot{display:inline-block;margin-top:3cqw;padding:6px 0;background:none;border:0;font:inherit;font-size:14px;color:var(--m);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.ll-forgot:hover,.ll-lnk:hover{color:var(--t)}
.ll-btn{display:block;width:100%;height:max(48px,13.3cqw);margin-top:7cqw;border:0;border-radius:3.2cqw;background:var(--r);color:#fff;font-family:inherit;font-weight:600;font-size:15px;line-height:1;box-shadow:0 12px 26px -12px rgba(205,9,33,.9),inset 0 1px 0 rgba(255,255,255,.16);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s,transform .2s}
.ll-btn:hover{background:#E00B26}
.ll-btn:active{transform:translateY(1px);background:#B00820}.ll-btn:disabled{opacity:.6}
.ll-msg{font-size:14px;line-height:1.3;text-align:center;color:#fff}
/* pesan error/sukses = pil kaca yang sama dengan popup aplikasi */
.ll-msg:not(:empty){display:flex;align-items:center;justify-content:center;gap:2cqw;width:fit-content;max-width:100%;margin:4cqw auto 0;padding:2.4cqw 4.4cqw;border-radius:6cqw;background:rgba(22,15,18,.82);border:1.3px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)}
.ll-msg:not(:empty)::before{content:"";flex:none;width:2cqw;height:2cqw;border-radius:50%;background:var(--r2)}.ll-msg.ok:not(:empty)::before{background:#4cd27a}
.ll-cant{text-align:center;font-size:14px;color:var(--m);margin-top:8cqw}
.ll-lnk{background:none;border:0;padding:6px 2px;font:inherit;font-weight:500;color:var(--r2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.ll-sign{text-align:center;font-size:14px;color:var(--m);margin-top:auto;padding-top:34px}

.ll-or{display:flex;align-items:center;gap:12px;margin:16px 0 12px;color:var(--m);font-size:12px}.ll-or i{flex:1;height:1px;background:var(--k3)}
.ll-g{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;height:48px;border-radius:999px;border:1px solid var(--k3);background:var(--k2);color:var(--t);font:600 14px/1 inherit;cursor:pointer;transition:border-color .2s,background .2s}
.ll-g:hover{border-color:rgba(205,9,33,.6)}.ll-g svg{width:20px;height:20px}

/* ---- desktop: 2 kolom (form kiri, image MIKA kanan) ---- */
@media(min-width:900px){
 .ll{background:#070506;display:grid;place-items:center;padding:24px}
 .ll-win{flex-direction:row;width:min(100%,1180px);height:min(100%,790px);min-height:640px;overflow:hidden;border-radius:32px;border:1px solid rgba(255,255,255,.07);box-shadow:0 40px 120px -50px rgba(205,9,33,.35),0 30px 80px -30px #000}
 .ll-main{order:1;flex:0 0 44%;padding:0 0 26px;justify-content:flex-start;overflow-y:auto;scrollbar-width:none}.ll-main::-webkit-scrollbar{display:none}
 .ll-form{margin-top:clamp(36px,8vh,96px)}
 .ll-sign{padding-top:20px}
 .ll-hero{order:2;flex:1;margin:0;height:auto;border-left:1px solid rgba(255,255,255,.06)}
 .ll-ph{border-radius:0}
}
@media(min-width:900px) and (max-height:700px){.ll{place-items:start center}}

/* =====================================================================
   POPUP KACA — satu gaya untuk SEMUA pop up, mengikuti pil "6 items" di cover profil
   (latar bening + blur + garis tipis putih + teks putih).
   Mau ubah tampilan semua popup sekaligus? Edit token di bawah ini saja.
   Dipakai oleh: bottom sheet (menu, edit cover, upload, rename, pilih foto, folder Drive),
   action sheet, dialog hapus permanen (.dlg), dan toast.
   (Kartu kaca di halaman login diatur di login.css dengan nilai yang sama.)
   ===================================================================== */
:root{
 --pg-bg:rgba(22,15,18,.74);          /* isi panel (hitam hangat bening supaya teks putih selalu terbaca) */
 --pg-blur:blur(18px) saturate(1.5);  /* blur kaca */
 --pg-line:rgba(255,255,255,.22);     /* garis tepi tipis */
 --pg-bw:1.3px;                       /* tebal garis tepi */
 --pg-mu:rgba(255,255,255,.64);       /* teks sekunder */
 --pg-hair:rgba(255,255,255,.12);     /* garis pemisah antar baris */
 --pg-fill:rgba(255,255,255,.16);     /* isi tombol sekunder, input, chip */
 --pg-red:#CD0921;                   /* tombol bahaya (hapus) = merah logo */
 --pg-scrim:rgba(0,0,0,.42);          /* redup di belakang popup */
 --pg-r:34px;                         /* lengkung sudut panel */
}
/* ---------- bottom sheet ---------- */
.sheet{background:var(--pg-scrim);color:#fff;
 /* variabel warna aplikasi dibalik khusus di dalam popup, jadi chip/input/tombol/outline ikut kaca */
 --tx:#fff;--mu:var(--pg-mu);--pill:var(--pg-fill);--sh:var(--pg-hair);--sf:rgba(255,255,255,.12);--on:var(--ac);--onx:#fff}
.sheet>div{background:var(--pg-bg);-webkit-backdrop-filter:var(--pg-blur);backdrop-filter:var(--pg-blur);border:var(--pg-bw) solid var(--pg-line);
 border-radius:var(--pg-r);width:calc(100% - 20px);max-width:500px;margin:0 auto calc(10px + env(safe-area-inset-bottom,0px));padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.sheet h3{color:#fff}
.sheet button.o{color:#fff}.sheet button.o:last-child{border-bottom:0}
.sheet .o[style*="e5484d"]{color:#ff6961!important}
.sheet input,.sheet select{background:var(--pg-fill);border:1px solid rgba(255,255,255,.28);color:#fff}
.sheet input::placeholder{color:var(--pg-mu)}.sheet input:focus,.sheet select:focus{border-color:rgba(255,255,255,.7)}
.sheet select option{color:#111}
.sheet .chip{border:1px solid rgba(255,255,255,.3)}
.sheet .btn:disabled{opacity:.6}
.sheet .mas img,.sheet .mas video{border-radius:18px}
/* ---------- action sheet ---------- */
.sheet.as{background:var(--pg-scrim)}
.sheet.as>div{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));max-width:310px;margin:0 auto;overflow:visible;animation:asin .55s var(--e)}
.sheet.as.cl>div{animation:asout .3s var(--e) forwards}
@keyframes asin{from{opacity:0;transform:translateY(26px) scale(.93)}}@keyframes asout{to{opacity:0;transform:translateY(14px) scale(.95)}}
.asg,.asc{background:var(--pg-bg);color:#fff;border:var(--pg-bw) solid var(--pg-line);-webkit-backdrop-filter:var(--pg-blur);backdrop-filter:var(--pg-blur);box-shadow:0 18px 50px rgba(0,0,0,.28)}
.asg{border-radius:var(--pg-r);overflow:hidden}
.asc{display:block;width:100%;margin-top:6px;padding:13px;border-radius:99px;font-size:14px;font-weight:700}
.ast{display:grid;justify-items:center;gap:3px;padding:17px 18px 13px;text-align:center;border-bottom:1px solid var(--pg-hair)}
.ast b{font-size:13px;font-weight:700;color:#fff}.ast span{font-size:12px;color:var(--pg-mu);max-width:220px}
.asi{width:36px;height:36px;margin-bottom:4px;border-radius:50%;background:rgba(255,69,58,.2);color:#ff6961;display:grid;place-items:center}.asi svg{width:17px;height:17px}
.asd{display:block;width:100%;padding:13px;font-size:14px;font-weight:600;color:#ff6961}
.asd:active,.asc:active{background:var(--pg-hair)}
/* ---------- dialog hapus permanen ---------- */
.dlg{background:var(--pg-scrim)}
.dc{border:var(--pg-bw) solid var(--pg-line)}
.db button{border:1px solid rgba(255,255,255,.3)}
.dn{background:var(--pg-fill)}
.dx{background:var(--pg-red);border-color:rgba(255,255,255,.4)}
/* ---------- toast ---------- */
@keyframes ntin{from{opacity:0;transform:translate(-50%,-26px) scale(.96)}}
.toast{display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100% - 32px);padding:10px 12px 10px 18px;border-radius:99px;
 background:var(--pg-bg);color:#fff;border:var(--pg-bw) solid var(--pg-line);box-shadow:none;-webkit-backdrop-filter:var(--pg-blur);backdrop-filter:var(--pg-blur);animation:ntin .55s var(--e)}
.toast.out{opacity:0;transform:translate(-50%,-26px) scale(.96);transition:transform .4s var(--e),opacity .3s}
.ti{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#E00B26,#8f0617);color:#fff;display:grid;place-items:center;flex:none}
.tb{flex:1;min-width:0;font-size:14px;font-weight:500;line-height:1.25}
.ta{background:var(--pg-fill);border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:6px 14px;color:#fff;font-weight:700;font-size:13px}

/* ---------- preview cover profil (klik cover) ---------- */
.cvp{align-content:center;gap:16px;padding:20px}
.cvc{position:relative;max-width:min(92vw,520px);border-radius:34px;overflow:hidden;background:#111;
 box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 var(--pg-bw) rgba(255,255,255,.4);animation:dpop .5s var(--e)}
.cvi{display:block;width:auto;height:auto;max-width:min(92vw,520px);max-height:68vh;object-fit:contain}
.cvc .glass.cvn{top:auto;bottom:14px;left:14px;font-size:13px;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cvw{display:grid;gap:14px;width:max-content;min-width:min(86vw,260px);max-width:min(92vw,520px)}
.cvb{display:flex;gap:10px;width:100%;animation:dpop .6s var(--e)}
.cvb button{flex:1;padding:13px;border-radius:99px;font-weight:700;font-size:15px;color:#fff;background:rgba(255,255,255,.2);
 -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:var(--pg-bw) solid rgba(255,255,255,.4)}
.cvp.cl .cvw{animation:dpout .3s var(--e) forwards}
.cvp.cl .cvc,.cvp.cl .cvb{animation:none}

/* ---------- Profile: "Edit profile" + "Photo categories" sheets, Account rows ---------- */
.pfl{display:flex;align-items:center;gap:10px;min-width:0}
.pfl>img,.pfl>i{flex:none;width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--pill);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px}
.pfm{display:grid;gap:1px;min-width:0;text-align:left}
.pfm .mu{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfe h3{margin:0 0 16px;font-size:20px}
.pfn{display:block;font-size:12px;color:var(--pg-mu);margin:18px 0 8px}
.pfv{position:relative;height:132px;border-radius:24px;background:var(--pg-fill) center/cover no-repeat;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);margin-bottom:6px}
.pfav{position:absolute;left:16px;bottom:-34px;width:80px;height:80px;border-radius:50%;border:3px solid #241a1d;background:#33272b;color:#fff;font-size:30px;font-weight:700;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.pfai{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;overflow:hidden}
.pfai img{width:100%;height:100%;object-fit:cover;display:block}
.pfpen{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:#fff;color:#16181c;display:grid;place-items:center;border:2px solid #241a1d}
.pfpen svg{width:13px;height:13px}
.pfr{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding-left:104px;font-size:12px}
.pfr .chip{flex:none}
.pfe input{width:100%;box-sizing:border-box;padding:13px 16px;border-radius:16px;font-size:16px}
.pfa{display:flex;gap:8px;margin-top:18px}.pfa .chip{flex:1;padding:12px;font-size:15px;font-weight:600}.pfa .btn{flex:2}
.pfg{display:flex;flex-wrap:wrap;gap:8px}
.pfg .chip{padding:9px 16px;font-size:14px;border:1px solid rgba(255,255,255,.3)}
.pfg .chip.a{background:var(--on);color:var(--onx);border-color:transparent}

/* Edit profile: foto profil + keterangan (tanpa cover) */
.pfh{display:flex;align-items:center;gap:16px;margin-bottom:4px}
.pfh .pfav{position:relative;left:auto;bottom:auto;flex:none}
.pfm2{display:grid;gap:6px;justify-items:start;min-width:0;font-size:12px;color:var(--pg-mu,rgba(255,255,255,.65))}.pfm2 b{font-size:17px;color:#fff;font-weight:600}
.pfm2 .chip{padding:7px 14px;font-size:14px}

/* =====================================================================
   GALERI KALENDER (detail bulan) + PREVIEW FOTO
   - Detail bulan: grid kalender 7 kolom, satu kotak per hari, bulan menumpuk ke bawah.
   - Preview foto: latar blur dari foto, tombol kaca, strip thumbnail, bar aksi kaca.
   Logika ada di gallery.js. Gaya kaca memakai token --pg-* dari popup.css.
   ===================================================================== */

/* ---------- detail bulan: grid kalender ---------- */
.cgd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dy{position:relative;display:block;width:100%;aspect-ratio:1;padding:0;border:0;border-radius:16px;overflow:visible;
 color:#fff;font-size:13px;font-weight:600;letter-spacing:-.01em;
 background:var(--sf) center/cover no-repeat;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 8px 16px -8px rgba(0,0,0,.5);
 animation:dyin .6s var(--e) both;animation-delay:min(calc(var(--i,0)*14ms),420ms);
 transition:transform .45s var(--e),box-shadow .45s var(--e),opacity .3s}
.dy span{position:absolute;left:0;right:0;bottom:4px;z-index:2;text-align:center;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.75)}
/* hari berfoto: kilau kaca + gradasi bawah supaya angka terbaca */
.dy.has{cursor:pointer;border-radius:16px}
.dy.has::before{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;
 background:linear-gradient(145deg,rgba(255,255,255,.26),transparent 38%),linear-gradient(transparent 50%,rgba(0,0,0,.58))}
.dy.has:active{transform:scale(.92)}
/* hari kosong: redup, hanya garis tipis */
.dy.em{background:rgba(128,128,128,.07);box-shadow:inset 0 0 0 1px rgba(128,128,128,.22);color:var(--mu);font-weight:500;opacity:.6;pointer-events:none}
.dy.em span{text-shadow:none}
.dy.td.em{opacity:1;color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--tx)}
/* hari terpilih: bingkai putih + cahaya hangat (sama seperti referensi) */
.dy.on{transform:scale(1.09);z-index:3;
 box-shadow:inset 0 0 0 1.6px rgba(255,255,255,.95),0 0 0 1.6px rgba(255,255,255,.7),0 0 26px 4px rgba(205,9,33,.7)}
/* hanya video di hari itu */
.dy.vd{background:linear-gradient(135deg,#2e1d22,#140e10)}
.dy.vd::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#fff;opacity:.75;padding-bottom:10px}
/* jumlah foto jika lebih dari satu */
.dy .n{position:absolute;top:4px;right:4px;z-index:2;min-width:17px;height:17px;padding:0 5px;border-radius:9px;font-style:normal;font-size:12px;font-weight:700;
 display:grid;place-items:center;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35)}
.dy .vi{position:absolute;top:4px;left:4px;z-index:2;min-width:17px;height:17px;padding:0 5px;border-radius:9px;font-style:normal;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:3px;color:#fff;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35)}
.dy .vi svg{display:block}
@keyframes dyin{from{opacity:0;transform:scale(.8)}}
/* nama hari di atas grid */
.cwk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:0 0 8px;text-align:center;font-size:12px;font-weight:600;color:var(--mu);letter-spacing:.04em}
.cm{padding-bottom:20px}

/* ---------- preview foto ---------- */
.view.pv{background:#000;animation:pvfade .35s var(--e)}
@keyframes pvfade{from{opacity:0}}
@keyframes pvtop{from{opacity:0;transform:translateY(-16px)}}
@keyframes pvbot{from{opacity:0;transform:translateY(22px)}}

.pv-bgw{position:absolute;inset:0;overflow:hidden;background:#070405;pointer-events:none}
.pv-bgw::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.5),transparent 30%,transparent 52%,rgba(0,0,0,.7))}
.pv-bg{position:absolute;inset:-14%;background:#111 center/cover no-repeat;filter:blur(48px) saturate(1.5) brightness(.52);opacity:0;transition:opacity .6s var(--e)}
.pv-bg.in{opacity:1}

.pv .st{position:absolute;inset:0;z-index:1}
.pv{--pvb:90px}.pv.ms{--pvb:156px}
.pv .sl{padding:calc(62px + env(safe-area-inset-top,0px)) 8px var(--pvb)}
.pv .pw{position:relative;align-self:stretch;justify-self:stretch;min-width:0;min-height:0;display:grid;place-items:center;will-change:transform,opacity}
.pv .pw img,.pv .pw video{max-width:none;max-height:none;flex:none;border-radius:26px;object-fit:cover;background:none;box-shadow:none;border:0;outline:0;
 transition:transform .3s;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.pv.zm .pw img{border-radius:0;box-shadow:none}

.pc{transition:opacity .35s var(--e),transform .5s var(--e)}
.pv.hb .pv-top{opacity:0;transform:translateY(-14px);pointer-events:none}
.pv.hb .pv-bot{opacity:0;transform:translateY(16px);pointer-events:none}

.pv-top{position:absolute;left:0;right:0;top:0;z-index:3;display:grid;grid-template-columns:minmax(44px,1fr) auto minmax(44px,1fr);align-items:center;gap:8px;
 padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0;animation:pvtop .55s var(--e)}
.pv-b,.pv-cat{color:#fff;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1.3px solid rgba(255,255,255,.4)}
.pv-b{justify-self:start;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.pv-t{min-width:0;max-width:100%;display:grid;justify-items:center;gap:1px;padding:4px 0;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.6),0 0 2px rgba(0,0,0,.35);pointer-events:none}
.pv-t b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:600}
.pv-t span{font-size:12px;opacity:.85;white-space:nowrap}
.pv-cat{flex:0 1 auto;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600}
.pv-cat.pop{animation:catpop .45s var(--e)}
@keyframes catpop{from{opacity:0;transform:translateY(-6px) scale(.94)}}

.pv-bot{position:absolute;left:0;right:0;bottom:0;z-index:3;display:grid;justify-items:center;gap:6px;
 padding:0 0 20px;animation:pvbot .55s var(--e)}
.pv-fs{position:relative;display:flex;gap:6px;width:100%;overflow-x:auto;scrollbar-width:none;padding:4px calc(50% - 20px);
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
.pv-fs::-webkit-scrollbar{display:none}
.ft{flex:none;position:relative;width:40px;height:52px;border-radius:12px;overflow:hidden;background:#222;opacity:.55;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);transition:opacity .3s,box-shadow .3s}
.ft img{display:block;width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;border-radius:0;pointer-events:none}
.ft.a{opacity:1;box-shadow:0 0 0 1.5px #fff,0 6px 18px rgba(0,0,0,.5)}
.fv{display:grid;place-items:center;height:100%;font-size:12px;color:#fff}
.ft .fv.ov{position:absolute;inset:0;background:rgba(0,0,0,.28)}.ft .fv.ov svg{display:block}

/* dock menu: pil kaca paling bawah. Tombol toggle membuka/menutup semua aksi (share, favorit, detail, download, hapus) */
.pv-dock{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:0 12px}
.pv-bar{display:flex;align-items:center;flex:none;margin-left:auto;padding:6px;border-radius:99px;
 background:var(--pg-bg,rgba(28,30,34,.58));-webkit-backdrop-filter:var(--pg-blur,blur(18px) saturate(1.5));backdrop-filter:var(--pg-blur,blur(18px) saturate(1.5));
 border:var(--pg-bw,1.3px) solid var(--pg-line,rgba(255,255,255,.5))}
.pv-acts{display:flex;gap:2px;max-width:0;opacity:0;overflow:hidden;pointer-events:none;transition:max-width .5s var(--e),opacity .3s,margin .5s var(--e)}
.pv.mx .pv-acts{max-width:230px;opacity:1;pointer-events:auto;margin-right:4px}
.pv-bar button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;transition:color .25s,background-color .25s,transform .35s var(--e)}
.pv-bar button:active{background:rgba(255,255,255,.18)}
.pv-bar svg{display:block}
.pv-tg{background:rgba(255,255,255,.12)}
.pv-bar button[data-f].on{color:#FF4B5C}
.pv-bar button[data-f].on svg{filter:drop-shadow(0 0 8px rgba(205,9,33,.65))}

/* info foto (sheet kaca) */
.pvi .row{padding:12px 0}
.pvi .v{max-width:62%;text-align:right;overflow-wrap:anywhere}
.pvi .chip{border:1px solid rgba(255,255,255,.3);padding:7px 14px;font-size:13px}


/* tombol play melayang di tengah video + penggeser waktu */
.pv .pw .vpl{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;display:grid;place-items:center;color:#fff;
 background:var(--pg-bg,rgba(28,30,34,.58));-webkit-backdrop-filter:var(--pg-blur,blur(18px) saturate(1.5));backdrop-filter:var(--pg-blur,blur(18px) saturate(1.5));
 border:var(--pg-bw,1.3px) solid var(--pg-line,rgba(255,255,255,.5));box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity .3s,transform .45s var(--e)}
.pv .pw .vpl svg{margin-left:4px}
.pv .pw .vpl:active{transform:scale(.93)}
.pv .sl.playing .vpl{opacity:0;transform:scale(.8);pointer-events:none}
.pv .pw .vsk{position:absolute;left:8%;right:8%;bottom:6px;width:84%;height:26px;margin:0;padding:0;border:0;background:none;-webkit-appearance:none;appearance:none;touch-action:none;cursor:pointer;transition:opacity .35s}
.pv.hb .vsk{opacity:0;pointer-events:none}
.vsk::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(255,255,255,.32)}
.vsk::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.vsk::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.32)}
.vsk::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}

/* tarik ke bawah / sedang menutup: kontrol memudar, animasi lain tidak bentrok */
.pv.dg .pc,.pv.pcl .pc{opacity:0;pointer-events:none}
.pv.pcl .pv-top,.pv.pcl .pv-bot{animation:none}
.pv.pcl .pw img,.pv.pcl .pw video{box-shadow:none}
.pv.pcl .vpl,.pv.pcl .vsk{opacity:0}


/* loading video (mis. video Google Drive): tombol play berubah jadi spinner */
.pv .sl.ld .vpl{opacity:1;transform:none;pointer-events:none}
.pv .sl.ld .vpl svg{opacity:0}
.pv .sl.ld .vpl::after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.28);border-top-color:#fff;animation:vspin .8s linear infinite}
@keyframes vspin{to{transform:rotate(360deg)}}

/* kalender: geser antar bulan */
.cm{touch-action:pan-y;will-change:transform,opacity;user-select:none;-webkit-user-select:none}
.cm.cmx .dy{animation:none}
#scr{overflow-x:hidden}

/* hati favorit: cincin pulsa saat ditandai */
.pv-bar button{position:relative}
.hring{position:absolute;inset:3px;border-radius:50%;border:2px solid #FF4B5C;pointer-events:none;animation:hring .65s var(--e) forwards}
@keyframes hring{from{opacity:.9;transform:scale(.5)}to{opacity:0;transform:scale(1.8)}}

  if(op=="select")return{data:t.map(r=>({...r,user_id:"u1"})),error:null};

  if(op=="insert"){const{user_id,...r}=pay;t.push(r);return{error:null}}
  if(op=="delete"){store[n]=t.filter(r=>!m(r));return{error:null}}};
 const o={select(){if(!op)op="select";return o},update(p){op="update";pay=p;return o},insert(p){op="insert";pay=p;return Promise.resolve(run())},delete(){op="delete";return o},eq(k,v){f.push([k,v]);return o},order(){return o},upsert(){return Promise.resolve({error:null})},maybeSingle(){return Promise.resolve({data:n=="user_accounts"?{plan_id:"free",quota_override:null,plans:{name:"Free",storage_bytes:5e9,max_file_bytes:5e8}}:null,error:null})},then(a,b){return Promise.resolve(run()).then(a,b)}};return o}

<script>
// Adapter: menyediakan API window.claude.use("user"|"db"|"assets"|"downloads") di atas Supabase,
// sehingga seluruh logika UI MIKA Photos yang lama tetap berjalan tanpa diubah.
(()=>{const C=window.LUMEN_CONFIG||{};
if(!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY){window.claude=null;return}
const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
window.sb=sb;let uid,SP;const R={},L={},TM={},RT=new Set(),META=new Map();
const OR="lumen_orphans",orph=()=>{try{return JSON.parse(localStorage.getItem(OR)||"[]")}catch(e){return[]}},setOr=a=>{try{localStorage.setItem(OR,JSON.stringify(a))}catch(e){}};
const login=()=>LumenLogin.show(sb); // UI ada di login.js; autentikasi tetap Supabase (signInWithPassword/signUp)
const ses=()=>SP||(SP=sb.auth.getSession().then(async r=>{const s=r.data.session||await login();uid=s.user.id;return s}));

sb.auth.onAuthStateChange(ev=>{
  if(ev=="SIGNED_OUT"&&uid){
    location.replace(location.pathname+location.search+"#home");
  }
});

async function sign(rows,raw){
 const P=[];
 raw.forEach(r=>{
  if(r.storage_path)P.push(r.storage_path);
  if(r.data?.tid)P.push(r.data.tid);
 });
 const M={};
 if(P.length){
  const{data}=await sb.storage.from("photos").createSignedUrls([...new Set(P)],86400);
  (data||[]).forEach(x=>{
   if(x.signedUrl)M[x.path]=x.signedUrl;
  });
 }
 rows.forEach((x,i)=>{
  const r=raw[i];
  x.doc.th=r.data.tid?M[r.data.tid]||"":"";
  x.doc.sp=r.storage_path?"supabase":r.google_drive_file_id?"drive":"";
  x.doc.bs=r.storage_path&&r.google_drive_file_id?"done":"none";
  x.doc.gid=r.google_drive_file_id||"";
  x.doc.cid=r.drive_conn_id||"";
  x.doc.url=r.storage_path?(M[r.storage_path]||""):x.doc.th;
 });
}

async function load(n){
 const{data,error}=await sb.from(n).select("*");
 if(error)throw error;
 const rows=data.map(r=>({
  id:r.id,
  doc:n=="photos"?{...r.data}:r.data
 }));
 if(n=="photos")await sign(rows,data);
 R[n]=rows;
 (L[n]||[]).forEach(f=>f(rows));
 return rows;
}
const rl=n=>{clearTimeout(TM[n]);TM[n]=setTimeout(()=>load(n).catch(()=>{}),250)};
function watch(n,f,er){(L[n]=L[n]||[]).push(f);if(R[n])f(R[n]);else load(n).catch(er||(()=>{}));
if(!RT.has(n)){RT.add(n);sb.channel("lumen_"+n).on("postgres_changes",{event:"*",schema:"public",table:n},()=>rl(n)).subscribe()}return()=>{}}
async function put(n,id,d){
 let data=d,cols={};

 if(n=="photos"){
  const{url,th,sp,bs,bid,gid,cid,...rest}=d;
  data=rest;

  const m=META.get(d.aid);
  if(m){
   cols={
    storage_path:m.prov=="supabase"?d.aid:null,
    google_drive_file_id:m.prov=="drive"?m.did:
     m.prov=="supabase"?m.did||null:null,
    drive_conn_id:m.cid||null
   };
  }
 }

 const{data:u,error:e1}=await sb.from(n)
  .update({data,...cols})
  .eq("id",id)
  .eq("user_id",uid)
  .select("id");

 if(e1)throw e1;

 if(!u.length){
  const row={id,user_id:uid,data,...cols};
  const{error}=await sb.from(n).insert(row);
  if(error)throw error;
 }

 if(d.aid)META.delete(d.aid);
 rl(n);
}
const coll=n=>({doc:id=>({set:d=>put(n,id,d),async delete(){const{error}=await sb.from(n).delete().eq("id",id).eq("user_id",uid);if(error)throw error;rl(n)},
 onSnapshot:(cb,er)=>watch(n,rows=>{const r=rows.find(x=>x.id===id);cb({data:()=>r?r.doc:undefined})},er)}),
 onSnapshot:(cb,er)=>watch(n,rows=>cb({docs:rows.map(r=>({id:r.id,data:()=>r.doc}))}),er)});
const DB={doc:()=>({collection:coll}),collection:coll};

const BIG=6291456;

const tusUp=(key,f,onProgress)=>new Promise(async res=>{
 const s=(await sb.auth.getSession()).data.session;
 const u=new tus.Upload(f,{
  endpoint:C.SUPABASE_URL+"/storage/v1/upload/resumable",
  retryDelays:[0,2000,5000,10000,20000],
  headers:{authorization:"Bearer "+s.access_token,"x-upsert":"false"},
  uploadDataDuringCreation:true,
  removeFingerprintOnSuccess:true,
  chunkSize:BIG,
  metadata:{
   bucketName:"photos",
   objectName:key,
   contentType:f.type||"application/octet-stream",
   cacheControl:"3600"
  },
  onProgress:(sent,total)=>{
   if(onProgress)onProgress(Math.round(sent/total*100),sent,total);
  },
  onError:e=>res({error:e}),
  onSuccess:()=>res({error:null})
 });
 u.findPreviousUploads().then(p=>{
  if(p.length)u.resumeFromPreviousUpload(p[0]);
  u.start();
 }).catch(e=>res({error:e}));
});

const xhrUp=(key,f,onProgress)=>new Promise(resolve=>{
 const s=sb.auth.getSession();
 s.then(({data:{session}})=>{
  const x=new XMLHttpRequest();
  const path=key.split("/").map(encodeURIComponent).join("/");
  x.open("POST",C.SUPABASE_URL+"/storage/v1/object/photos/"+path);
  x.setRequestHeader("Authorization","Bearer "+session.access_token);
  x.setRequestHeader("apikey",C.SUPABASE_ANON_KEY);
  x.setRequestHeader("Content-Type",f.type||"application/octet-stream");
  x.setRequestHeader("x-upsert","false");

  x.upload.onprogress=e=>{
   if(e.lengthComputable&&onProgress){
    onProgress(Math.round(e.loaded/e.total*100),e.loaded,e.total);
   }
  };

  x.onload=()=>{
   if(x.status>=200&&x.status<300)resolve({error:null});
   else{
    let msg=x.responseText||"Upload failed";
    try{msg=JSON.parse(msg).message||msg}catch(e){}

<script>

 return{det:await cocoSsd.load({base:"lite_mobilenet_v2"}),net:await mobilenet.load({version:2,alpha:1})}})().catch(e=>{M=null;throw e}));

const ARCH=/castle|palace|church|mosque|monastery|triumphal arch|dome|lighthouse|bridge|viaduct|obelisk|stupa|library|cinema|barn|boathouse|bell cote|greenhouse|patio|fountain|water tower|bookshop|restaurant|prison|planetarium|altar|totem|megalith|street sign|traffic light|turnstile/i;

 try{const m=await loadAI(),bm=await createImageBitmap(f),k=Math.min(1,320/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(bm.width*k));c.height=Math.max(1,Math.round(bm.height*k));c.getContext("2d").drawImage(bm,0,0,c.width,c.height);

  if(data&&data.plans){LQ.cap=data.quota_override||data.plans.storage_bytes;LQ.max=data.plans.max_file_bytes;LQ.plan=data.plans.name;render()}}catch(e){}

  const ua=navigator.userAgent,pl=/iPhone|iPad/.test(ua)?"iOS":/Android/.test(ua)?"Android":/Mac/.test(ua)?"macOS":/Windows/.test(ua)?"Windows":"Web";

LF.regroupRun=async x=>{

 LF.aiFail=0;let n=0;for(const p of l){try{toast(`Categorizing ${++n}/${l.length}…`);const b=await(await fetch(p.th||p.url)).blob(),c=await autoCat(new File([b],p.name,{type:"image/jpeg"}));

 sheet(`<h3 style="margin-top:0">${d.length} duplicate group${d.length>1?"s":""}</h3><div class=mas style="columns:3">${d.map(a=>isVid(a[0])?"":`<img src="${T(a[0])}" style="opacity:1">`).join("")}</div><button class=o data-x=go>Move ${extra.length} cop${extra.length>1?"ies":"y"} to Recently Deleted</button>`,x=>{if(x=="go")delPhotos(extra)})};

 sheet(`<h3 style="margin-top:0">Devices</h3><div class=mu style="font-size:12px;margin-bottom:6px">Tap another device to remove it from the list. This does not sign it out.</div>`+(data||[]).map(d=>`<button class=o data-x="${esc(d.id)}">${esc(d.name||d.platform)}${d.id==me?" (this device)":""} · ${new Date(d.last_seen).toLocaleDateString()}</button>`).join(""),async id=>{if(id==me)return;await sb.from("devices").delete().eq("id",id);toast("Device removed from the list")})}catch(e){toast("Couldn't load devices")}};

(()=>{

const DEMO=(()=>{const K=["mountain","hills","dunes","portrait","arch","people","abstract"],C={mountain:"Nature",hills:"Travel",dunes:"Nature",portrait:"Portraits",arch:"Architecture",people:"People",abstract:"Motion"},H=[800,900,600,700,520,860];
const sv=(k,w,h,s)=>{const a=s*37%40;let b;const R=`<rect width="${w}" height="${h}" `;
if(k=="mountain")b=`${R}fill="hsl(${200+a},70%,45%)"/><polygon points="0,${h} 0,${h*.7} ${w*.55},${h*.28} ${w},${h*.7} ${w},${h}" fill="#dde6ee"/><polygon points="${w*.55},${h*.28} ${w*.75},${h*.55} ${w*.5},${h*.5}" fill="#8fa6bb"/>`;
else if(k=="hills")b=`${R}fill="hsl(${205+a/2},35%,72%)"/><path d="M0 ${h*.6}Q${w*.4} ${h*.3} ${w} ${h*.55}V${h}H0Z" fill="hsl(${100+a},30%,30%)"/><path d="M0 ${h*.8}Q${w*.6} ${h*.55} ${w} ${h*.8}V${h}H0Z" fill="hsl(${110+a},30%,22%)"/>`;
else if(k=="dunes")b=`${R}fill="hsl(215,30%,65%)"/><path d="M0 ${h*.7}Q${w*.5} ${h*.2} ${w} ${h*.6}V${h}H0Z" fill="hsl(${18+a/3},60%,40%)"/><path d="M0 ${h*.85}Q${w*.5} ${h*.55} ${w} ${h*.85}V${h}H0Z" fill="hsl(${14+a/3},55%,30%)"/>`;
else if(k=="portrait")b=`${R}fill="hsl(${a*2},45%,22%)"/><rect x="${w*.15}" y="${h*.7}" width="${w*.7}" height="${h*.4}" rx="${w*.3}" fill="#a3262b"/><rect x="${w*.42}" y="${h*.55}" width="${w*.16}" height="${h*.2}" fill="#c98e72"/><ellipse cx="${w/2}" cy="${h*.42}" rx="${w*.17}" ry="${h*.15}" fill="#d9a587"/><path d="M${w*.3} ${h*.4}Q${w/2} ${h*.15} ${w*.7} ${h*.4}Q${w*.6} ${h*.28} ${w*.4} ${h*.3}Z" fill="#3a2418"/>`;
else if(k=="arch")b=`${R}fill="hsl(${30+a/2},25%,78%)"/><rect x="${w*.12}" y="${h*.18}" width="${w*.76}" height="${h*.4}" fill="hsl(120,22%,28%)"/><rect x="0" y="${h*.62}" width="${w}" height="${h*.38}" fill="hsl(25,30%,58%)"/><rect x="0" y="0" width="${w}" height="${h*.1}" fill="#5a3f2e"/>`;
else if(k=="people")b=`${R}fill="hsl(${a*3},8%,${30+a}%)"/><circle cx="${w*.35}" cy="${h*.35}" r="${w*.1}" fill="#15151a"/><rect x="${w*.2}" y="${h*.46}" width="${w*.3}" height="${h*.6}" rx="${w*.12}" fill="#15151a"/><circle cx="${w*.7}" cy="${h*.42}" r="${w*.09}" fill="#2a2a31"/><rect x="${w*.56}" y="${h*.52}" width="${w*.28}" height="${h*.6}" rx="${w*.12}" fill="#2a2a31"/>`;
